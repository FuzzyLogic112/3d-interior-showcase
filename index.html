<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>现代简约 · 两室一厅 — 3D 室内设计展示</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f2ecdf;
    --panel:rgba(255,253,247,.78);
    --panel-solid:#fffcf5;
    --ink:#2b2b2b;
    --ink-soft:#8a857c;
    --accent:#bc6c3f;
    --accent-deep:#9e5527;
    --accent-soft:rgba(188,108,63,.13);
    --line:rgba(70,54,32,.12);
    --seg-bg:rgba(120,96,64,.12);
    --shadow:0 18px 45px rgba(74,54,28,.17),0 4px 14px rgba(74,54,28,.09);
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17150f;
      --panel:rgba(34,30,24,.78);
      --panel-solid:#262219;
      --ink:#f2ead9;
      --ink-soft:#a89e8a;
      --accent:#d29a63;
      --accent-deep:#e0b07c;
      --accent-soft:rgba(210,154,99,.16);
      --line:rgba(240,233,218,.13);
      --seg-bg:rgba(255,255,255,.09);
      --shadow:0 18px 45px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);overflow:hidden;
  }
  #scene{position:fixed;inset:0;display:block;touch-action:none}
  .serif{font-family:"Noto Serif SC",serif}

  /* ---------- 顶部信息条 ---------- */
  #topbar{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:9px 22px;box-shadow:var(--shadow);backdrop-filter:blur(10px);z-index:30;max-width:calc(100vw - 24px);
  }
  #topbar .proj{font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;letter-spacing:.06em;white-space:nowrap}
  #topbar .meta{display:flex;gap:14px;font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
  #topbar .meta b{color:var(--ink);font-weight:700}
  #topbar .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);align-self:center;flex:none}

  /* ---------- 左侧房间导航 ---------- */
  #roomPanel{
    position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:20;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);backdrop-filter:blur(10px);padding:14px 12px;width:172px;
  }
  #roomPanel h3{margin:2px 6px 10px;font-size:12px;letter-spacing:.28em;color:var(--ink-soft);font-weight:500}
  .room-btn{
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;
    padding:9px 10px;margin:2px 0;border:1px solid transparent;border-radius:10px;background:transparent;
    color:var(--ink);font:inherit;font-size:14.5px;cursor:pointer;text-align:left;transition:background .18s,border-color .18s;
  }
  .room-btn small{font-size:11px;color:var(--ink-soft);white-space:nowrap}
  .room-btn:hover{background:rgba(165,118,63,.09)}
  .room-btn.active{background:rgba(165,118,63,.14);border-color:rgba(165,118,63,.35)}
  .room-btn.active small{color:var(--accent-deep)}

  /* ---------- 底部工具栏 ---------- */
  #toolbar{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;
    display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px);
  }
  .ctl{
    background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
    backdrop-filter:blur(10px);padding:5px;display:flex;align-items:center;gap:2px;
  }
  .ctl .cap{font-size:11px;color:var(--ink-soft);letter-spacing:.14em;padding:0 6px 0 10px;white-space:nowrap}
  .seg-btn{
    border:0;background:transparent;color:var(--ink-soft);font:inherit;font-size:13.5px;
    padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .18s;
  }
  .seg-btn:hover{color:var(--ink)}
  .seg-btn.active{background:var(--accent);color:#fff;font-weight:500}
  #tourBtn{
    border:0;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;border-radius:999px;
    padding:10px 18px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);transition:opacity .18s;white-space:nowrap;
  }
  #tourBtn:hover{opacity:.85}
  #tourBtn.playing{background:var(--accent-deep);color:#fff}

  /* ---------- 右侧家具信息卡 ---------- */
  #infoCard{
    position:fixed;right:16px;top:50%;z-index:25;width:308px;max-width:calc(100vw - 32px);
    display:none;transform:translate(0,-50%);
    background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    backdrop-filter:blur(12px);padding:20px 20px 16px;
  }
  #infoCard.open{display:block;animation:cardIn .38s cubic-bezier(.22,.9,.3,1)}
  @keyframes cardIn{from{opacity:0;transform:translate(26px,-50%)}to{opacity:1;transform:translate(0,-50%)}}
  #infoCard .room-tag{
    display:inline-block;font-size:11px;letter-spacing:.2em;color:var(--accent-deep);
    border:1px solid rgba(165,118,63,.4);border-radius:999px;padding:3px 10px;margin-bottom:10px;
  }
  #infoCard h2{margin:0 0 12px;font-family:"Noto Serif SC",serif;font-size:21px;font-weight:700;line-height:1.3}
  #infoCard dl{margin:0;display:grid;gap:9px}
  #infoCard dt{font-size:11px;letter-spacing:.18em;color:var(--ink-soft)}
  #infoCard dd{margin:2px 0 0;font-size:14px;line-height:1.55}
  #infoCard .desc{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px;line-height:1.7;color:var(--ink-soft)}
  #infoClose{
    position:absolute;top:10px;right:12px;border:0;background:transparent;color:var(--ink-soft);
    font-size:20px;line-height:1;cursor:pointer;padding:6px;border-radius:8px;
  }
  #infoClose:hover{color:var(--ink)}

  /* ---------- 平面标注 ---------- */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
  .room-label{
    position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 11px 6px;
    box-shadow:0 4px 14px rgba(58,45,25,.13);opacity:0;transition:opacity .25s;
  }
  .room-label .rn{font-family:"Noto Serif SC",serif;font-weight:700;font-size:14.5px}
  .room-label .rd{font-size:11px;color:var(--accent-deep);margin-top:1px}
  .dim-label{
    position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:var(--accent-deep);
    background:var(--panel);border:1px solid rgba(165,118,63,.4);border-radius:999px;padding:3px 12px;
    white-space:nowrap;opacity:0;transition:opacity .25s;
  }
  body.plan-mode .room-label,body.plan-mode .dim-label{opacity:1}

  /* ---------- 导览卡片 ---------- */
  #tourCard{
    position:fixed;left:50%;bottom:150px;transform:translate(-50%,0);z-index:28;width:430px;max-width:calc(100vw - 28px);
    display:none;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    backdrop-filter:blur(12px);padding:16px 20px 14px;
  }
  #tourCard.show{display:block;animation:tourIn .35s ease}
  @keyframes tourIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
  #tourCard .t-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  #tourCard h2{margin:0;font-family:"Noto Serif SC",serif;font-size:19px}
  #tourCard .t-step{font-size:12px;color:var(--accent-deep);white-space:nowrap}
  #tourCard p{margin:8px 0 12px;font-size:13.5px;line-height:1.7;color:var(--ink-soft)}
  #tourCard .t-bar{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
  #tourCard .t-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
  #tourStop{
    margin-top:11px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;
    font-size:12.5px;border-radius:999px;padding:6px 14px;cursor:pointer;
  }
  #tourStop:hover{border-color:var(--accent);color:var(--accent-deep)}

  /* ---------- 提示条 / 第一人称按钮 ---------- */
  #hint{
    position:fixed;left:16px;bottom:16px;z-index:18;font-size:12px;color:var(--ink-soft);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
    box-shadow:var(--shadow);backdrop-filter:blur(8px);max-width:min(430px,calc(100vw - 32px));
  }
  #fpPad{position:fixed;right:18px;bottom:86px;z-index:26;display:none;gap:10px}
  body.fp-mode #fpPad{display:flex}
  .fp-key{
    width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);font:inherit;font-size:13px;box-shadow:var(--shadow);cursor:pointer;user-select:none;-webkit-user-select:none;
  }
  .fp-key:active{background:var(--accent);color:#fff}

  /* ---------- 加载 / 异常 ---------- */
  #loading{
    position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;transition:opacity .5s;
  }
  #loading.done{opacity:0;pointer-events:none}
  #loading .l-title{font-family:"Noto Serif SC",serif;font-size:24px;font-weight:700;letter-spacing:.12em}
  #loading .l-sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.3em}
  #loadBarWrap{width:min(320px,72vw);height:4px;border-radius:99px;background:var(--line);overflow:hidden}
  #loadBar{height:100%;width:0%;background:var(--accent);border-radius:99px;transition:width .25s}
  #loadTip{font-size:12px;color:var(--ink-soft)}
  #nogl{
    position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:var(--bg);padding:24px;
  }
  #nogl .box{max-width:420px;text-align:center;background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:var(--shadow)}
  #nogl h2{font-family:"Noto Serif SC",serif;margin:0 0 10px;font-size:20px}
  #nogl p{font-size:14px;line-height:1.8;color:var(--ink-soft);margin:0}

  /* ================= 生动化改版：毛玻璃拟态 + 胶囊控件 + 柔和动效 ================= */
  #topbar,#roomPanel,#infoCard,#tourCard,#hint,.fab-btn,#themePop,#arrangeBar,#selChip{
    background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(16px) saturate(1.35);backdrop-filter:blur(16px) saturate(1.35);
  }
  #topbar,#roomPanel,#infoCard,#tourCard,.fab-btn,#themePop,#arrangeBar,#selChip,.room-btn,.mini-btn,.tp-btn,#arrangeBtn{
    transition:background-color .6s ease,border-color .6s ease,color .25s ease,box-shadow .3s ease,transform .25s ease,opacity .3s ease;
  }
  @keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideL{from{opacity:0;transform:translate(-14px,-50%)}to{opacity:1;transform:translate(0,-50%)}}

  /* 顶栏：品牌左对齐 + iOS 分段控件 + 布置开关 */
  #topbar{
    left:16px;right:16px;transform:none;justify-content:space-between;flex-wrap:nowrap;
    border-radius:20px;padding:10px 14px 10px 20px;gap:14px;max-width:none;
    animation:fadeDown .55s cubic-bezier(.22,.9,.3,1) both;
  }
  .brand{display:flex;flex-direction:column;gap:1px;min-width:0;flex:none}
  .brand .sub{font-size:11px;color:var(--ink-soft);letter-spacing:.24em;white-space:nowrap}
  .top-ctl{display:flex;align-items:center;gap:10px;flex:none}
  .view-seg{position:relative;display:flex;align-items:center;gap:2px;background:var(--seg-bg);border-radius:999px;padding:4px}
  .seg-ind{position:absolute;top:4px;bottom:4px;left:0;width:60px;border-radius:999px;background:var(--panel-solid);box-shadow:0 3px 10px rgba(60,45,20,.18);transition:transform .38s cubic-bezier(.3,.9,.3,1),width .38s cubic-bezier(.3,.9,.3,1)}
  .view-seg .seg-btn{position:relative;z-index:1}
  .view-seg .seg-btn.active{background:transparent;color:var(--ink);font-weight:600}
  .view-seg .seg-btn:hover{transform:none;color:var(--ink)}
  #arrangeBtn{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-solid);
    color:var(--ink);font:inherit;font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
  }
  #arrangeBtn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(74,54,28,.16)}
  #arrangeBtn .arr-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-soft);flex:none;transition:all .25s}
  #arrangeBtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #arrangeBtn.on .arr-dot{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}

  /* 布置模式提示条 */
  #arrangeBar{
    position:fixed;top:88px;left:50%;transform:translate(-50%,-8px);z-index:29;
    display:flex;align-items:center;gap:8px;border-radius:999px;padding:7px 9px 7px 18px;
    opacity:0;pointer-events:none;max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center;
  }
  body.arrange-mode #arrangeBar{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #arrangeBar .arr-hint{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
  #arrangeBar .arr-hint b{color:var(--accent-deep)}
  .mini-btn{border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);font:inherit;font-size:12.5px;padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .mini-btn:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--accent-deep)}
  .mini-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:600}
  .mini-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  /* 左侧房间导航：图标小卡片 */
  #roomPanel{border-radius:20px;padding:14px 10px;width:198px;animation:slideL .55s .08s cubic-bezier(.22,.9,.3,1) both}
  .room-btn{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:10px 12px;border-radius:14px;margin:3px 0}
  .room-btn .ric{display:flex;flex:none;color:var(--ink-soft);transition:color .2s}
  .room-btn .ric svg{width:22px;height:22px}
  .room-btn .rname{flex:1}
  .room-btn:hover{background:var(--accent-soft);transform:translateY(-2px);box-shadow:0 8px 18px rgba(74,54,28,.13)}
  .room-btn.active{background:var(--accent-soft);border-color:transparent}
  .room-btn.active .ric{color:var(--accent-deep)}
  .room-btn.active::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .room-btn.active small{color:var(--accent-deep)}

  /* 家具信息卡：chips + 引用式说明 + 关闭旋转 */
  #infoCard{border-radius:20px}
  #infoCard .chip{display:inline-block;background:var(--accent-soft);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
  #infoCard .chip-mat{background:var(--panel-solid)}
  #infoCard .desc{border-top:none;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:10px 14px}
  #infoClose{transition:transform .35s ease,color .2s}
  #infoClose:hover{transform:rotate(90deg)}

  /* 右下角浮动图标按钮组 */
  .fab-col{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px;animation:fadeUp .55s .15s ease both}
  .fab-wrap{position:relative}
  .fab-btn{display:flex;align-items:center;height:48px;min-width:48px;padding:0 14px;border-radius:999px;cursor:pointer;color:var(--ink);font:inherit}
  .fab-btn svg{width:20px;height:20px;flex:none}
  .fab-btn .fab-ic{display:flex}
  .fab-btn .fab-label{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:500;transition:max-width .32s ease,opacity .25s ease,margin .32s ease}
  .fab-btn:hover{transform:translateY(-2px)}
  .fab-btn:hover .fab-label{max-width:120px;opacity:1;margin-left:9px}
  #tourBtn{background:var(--panel);color:var(--ink);padding:0 14px;box-shadow:var(--shadow)}
  #tourBtn.playing{background:var(--accent);color:#fff;border-color:var(--accent)}
  #lightToggle .ic-moon{display:none}
  #lightToggle.is-night .ic-moon{display:block}
  #lightToggle.is-night .ic-sun{display:none}
  #themePop{position:absolute;right:0;bottom:60px;width:192px;border-radius:18px;padding:10px;opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;transition:all .25s ease;z-index:31}
  #themePop.open{opacity:1;transform:none;pointer-events:auto}
  #themePop .tp-cap{font-size:11px;letter-spacing:.2em;color:var(--ink-soft);padding:2px 8px 8px}
  .tp-btn{display:flex;align-items:center;gap:9px;width:100%;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;padding:9px 10px;border-radius:12px;cursor:pointer;text-align:left}
  .tp-btn i{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .tp-btn:hover{background:var(--accent-soft);transform:translateY(-1px)}
  .tp-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:600}

  /* 选中家具悬浮操作条 */
  #selChip{position:fixed;z-index:27;display:none;align-items:center;gap:6px;transform:translate(-50%,-100%);border-radius:999px;padding:6px 8px 6px 14px}
  #selChip .sc-name{font-size:12.5px;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #selChip button{border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);font:inherit;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;transition:all .2s;white-space:nowrap}
  #selChip button:hover{border-color:var(--accent);color:var(--accent-deep);transform:translateY(-1px)}

  /* 加载屏：流光进度 + 百分比 */
  #loading .l-title{font-size:30px}
  #loadBar{background:linear-gradient(90deg,var(--accent) 0%,#eccfa5 50%,var(--accent) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-100% 0}}
  #loadPct{font-family:"Noto Serif SC",serif;font-size:15px;color:var(--accent-deep);letter-spacing:.12em}

  #fpPad{bottom:206px}
  .room-label{border-radius:12px}
  @media (max-width:1150px){ #topbar .meta{display:none} }

  /* ---------- 平板 / 手机 ---------- */
  @media (max-width:900px){
    #topbar{left:10px;right:10px;top:10px;padding:8px 10px 8px 14px;flex-wrap:wrap;border-radius:18px;gap:8px}
    .brand .sub{display:none}
    #topbar .proj{font-size:16px}
    .top-ctl{margin-left:auto}
    .view-seg .seg-btn{padding:6px 9px;font-size:12.5px}
    #arrangeBtn{padding:8px 12px;font-size:12.5px}
    #arrangeBar{top:auto;bottom:196px;left:10px;right:10px;transform:none;border-radius:18px;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
    #arrangeBar::-webkit-scrollbar{display:none}
    body.arrange-mode #arrangeBar{transform:none}
    #arrangeBar .arr-hint{display:none}
    #roomPanel{
      left:10px;right:10px;top:128px;bottom:auto;transform:none;width:auto;padding:8px;animation:none;
      display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;
    }
    #roomPanel::-webkit-scrollbar{display:none}
    #roomPanel h3{display:none}
    .room-btn{flex:none;width:auto;padding:8px 11px;margin:0}
    .room-btn small{display:none}
    .room-btn.active::before{display:none}
    #hint{display:none}
    #infoCard{top:auto;bottom:0;right:0;left:0;width:auto;max-width:none;border-radius:18px 18px 0 0;transform:none}
    #infoCard.open{animation:cardInM .38s cubic-bezier(.22,.9,.3,1)}

<!-- Three.js r147 经典全局构建（自托管于 assets/，离线/弱网也能打开，演示更稳） -->

<script>
(function(){

/* =====================================================================

  { id:'kitchen', name:'厨房',   rect:[ 2.4, 1.7, 5.4, 4.1], view:{cam:[ 2.6,1.8, 3.75], tgt:[ 4.9,0.85, 2.3]}, blurb:'L 型橱柜贴合洗—切—炒黄金三角，高柜嵌入冰箱，台面高低错层久站不累腰。' },

  { id:'bath',    name:'卫生间', rect:[-0.6,-4.1, 1.6,-2.3], view:{cam:[ 1.45,1.7,-2.5], tgt:[-0.35,0.75,-3.7]}, blurb:'干湿分离三段式：台盆外置、玻璃隔断淋浴区、壁挂马桶无卫生死角，清晨不排队。' },
  { id:'balcony', name:'阳台',   rect:[-5.4, 4.1,-2.4, 5.6], view:{cam:[-1.7,1.8, 3.3], tgt:[-4.2,0.9, 5.2]}, blurb:'家政柜整合洗衣机与清洁工具，一把休闲椅一杯茶，把南向阳光留给生活。' }
];
function roomById(id){ for(var i=0;i<ROOMS.length;i++) if(ROOMS[i].id===id) return ROOMS[i]; return null; }
function roomDims(r){ var w=(r.rect[2]-r.rect[0]).toFixed(1), d=(r.rect[3]-r.rect[1]).toFixed(1); return w+' × '+d+' m'; }

/* ---------- 材质主题（三套配色，切换时 0.6s 颜色过渡） ---------- */
var THEMES = {
  wood:  { wall:0xf3ead8, floor:0xc9a273, sofa:0xbb8452, cushion:0xe6d7bd, curtain:0xdec39d, cabinet:0x9a6f45, bedding:0xe9ddc6, label:'原木暖阳' },
  grey:  { wall:0xe9edf0, floor:0xb7bcc0, sofa:0x8b98a5, cushion:0xd9e0e7, curtain:0xc2cdd7, cabinet:0x707c86, bedding:0xd8dfe7, label:'云雾灰' },
  cream: { wall:0xfaf4e8, floor:0xd9bf9c, sofa:0xe9dfcd, cushion:0xf4ecdc, curtain:0xf0e3cd, cabinet:0xbfa27e, bedding:0xf6efe0, label:'奶油白' }
};

/* ---------- DOM ---------- */
var canvas = document.getElementById('scene');
var loadBar = document.getElementById('loadBar');
var loadPct = document.getElementById('loadPct');
var loadTip = document.getElementById('loadTip');
function setProgress(p, tip){ loadBar.style.width = Math.round(p*100)+'%'; loadPct.textContent = Math.round(p*100)+'%'; if(tip) loadTip.textContent = tip; }
function nextFrame(){ return new Promise(function(res){ requestAnimationFrame(res); }); }

/* ---------- WebGL 检测 ---------- */
var renderer = null;
try{
  renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true });
}catch(e){ renderer = null; }
if(!renderer || !window.THREE){
  document.getElementById('loading').style.display='none';
  document.getElementById('nogl').style.display='flex';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;   /* 柔和阴影 */
renderer.outputEncoding = THREE.sRGBEncoding;

renderer.shadowMap.autoUpdate = false;

/* ---------- 场景与相机 ---------- */
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c8de);

var perspCam = new THREE.PerspectiveCamera(46, window.innerWidth/window.innerHeight, 0.1, 200);
perspCam.position.set(-12.5, 10, 14.5);

var planCam = new THREE.OrthographicCamera(-1,1,1,-1, 0.1, 100);
function fitPlanCam(){
  var a = window.innerWidth/window.innerHeight, H = 13.6; /* 俯视可视高度(米) */
  planCam.left=-H*a/2; planCam.right=H*a/2; planCam.top=H/2; planCam.bottom=-H/2;
  planCam.updateProjectionMatrix();
}
fitPlanCam();
planCam.position.set(0, 24, 0.78);
planCam.up.set(0,0,-1); planCam.lookAt(0,0,0.78);

var orbit = new THREE.OrbitControls(perspCam, canvas);
orbit.target.set(0, 0.7, 0.8);
orbit.enableDamping = true; orbit.dampingFactor = 0.06;
orbit.maxPolarAngle = Math.PI*0.495; orbit.minDistance = 1.1; orbit.maxDistance = 30;

var planCtrl = new THREE.OrbitControls(planCam, canvas);
planCtrl.target.set(0,0,0.78);
planCtrl.enableRotate = false; planCtrl.enableDamping = true; planCtrl.dampingFactor = 0.08;
planCtrl.enabled = false;

/* 按需渲染：无交互/无动画时不重绘，省电且画面静止 */
var dirty = true, animUntil = 0;

orbit.addEventListener('change', function(){ poke(); });
planCtrl.addEventListener('change', function(){ poke(); });

/* ---------- 程序化纹理（木纹地板 / 岩板 / 抽象挂画） ---------- */
function makeCanvas(w,h,draw){
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; t.encoding=THREE.sRGBEncoding;
  return t;
}
var woodTex = makeCanvas(512,512,function(g,w,h){
  g.fillStyle='#c8a26f'; g.fillRect(0,0,w,h);
  var rows=6;
  for(var r=0;r<rows;r++){
    var y=r*h/rows, tone=(Math.random()*14-7)|0;
    g.fillStyle='rgba('+(150+tone)+','+(105+tone)+','+(58+tone)+',0.25)'; g.fillRect(0,y,w,h/rows);
    g.fillStyle='rgba(90,60,30,0.55)'; g.fillRect(0,y,w,2);
    var seam=((r%2)? w*0.45 : w*0.75);
    g.fillRect(seam,y,2,h/rows);
    g.strokeStyle='rgba(120,82,40,0.18)'; g.lineWidth=1;
    for(var i=0;i<7;i++){
      g.beginPath(); var gy=y+6+Math.random()*(h/rows-12);
      g.moveTo(0,gy);
      for(var x=0;x<=w;x+=32) g.lineTo(x, gy+Math.sin(x*0.02+r)*2.2);
      g.stroke();
    }
  }
});
woodTex.repeat.set(5,4);
var rockTex = makeCanvas(512,512,function(g,w,h){
  g.fillStyle='#e8e6e1'; g.fillRect(0,0,w,h);
  for(var i=0;i<26;i++){
    g.strokeStyle='rgba(150,148,140,'+(0.10+Math.random()*0.16)+')';
    g.lineWidth=0.8+Math.random()*1.6;
    g.beginPath(); var x=Math.random()*w, y=Math.random()*h;
    g.moveTo(x,y);
    for(var s=0;s<5;s++){ x+=(Math.random()*90-45); y+=(Math.random()*90-45); g.lineTo(x,y); }
    g.stroke();
  }
});
var artTex = makeCanvas(256,340,function(g,w,h){
  g.fillStyle='#efe7d8'; g.fillRect(0,0,w,h);
  g.fillStyle='#b98d5f'; g.beginPath(); g.arc(w*0.62,h*0.34,52,0,7); g.fill();
  g.fillStyle='#5d6a72'; g.fillRect(w*0.16,h*0.52,w*0.5,h*0.30);
  g.fillStyle='#2e2a24'; g.fillRect(w*0.16,h*0.80,w*0.68,5);
});

/* ---------- 材质（主题色材质登记，换肤时统一过渡） ---------- */
function std(color, rough, metal){ return new THREE.MeshStandardMaterial({ color:color, roughness:(rough==null?0.85:rough), metalness:(metal||0) }); }
var themedMats = {};   /* 主题键 -> 材质，换肤时改 color */
function themed(key, rough){
  var m = std(THEMES.wood[key], rough);
  themedMats[key] = m; return m;
}
var M = {
  wall:    themed('wall', 0.95),
  floor:   new THREE.MeshStandardMaterial({ map:woodTex, color:THEMES.wood.floor, roughness:0.7 }),
  sofa:    themed('sofa', 0.95),
  cushion: themed('cushion', 0.95),
  curtain: themed('curtain', 0.9),
  cabinet: themed('cabinet', 0.6),
  bedding: themed('bedding', 0.95),
  ceil:    std(0xf7f3ea, 0.95),
  white:   std(0xf5f2ec, 0.6),
  counter: std(0xe9e5dc, 0.35),
  darkWood:std(0x6b4a2f, 0.55),

  green2:  std(0x74945f, 0.9),
  pot:     std(0xb0a696, 0.8),
  tile:    std(0xd3d8da, 0.5),

/* 发光材质（夜晚提亮） */
var downMat  = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xffe9c4, emissiveIntensity:0.12 });
var shadeMat = new THREE.MeshStandardMaterial({ color:0xf3e2c2, emissive:0xffc37a, emissiveIntensity:0.05, side:THREE.DoubleSide });
var stripMat = new THREE.MeshStandardMaterial({ color:0xfff4dd, emissive:0xffd9a0, emissiveIntensity:0.1 });

/* ---------- 建模小工具 ---------- */
var pickables = [];   /* 可点选家具根节点 */
function box(w,h,d,mat,x,y,z,parent,shadow){

}
/* 登记可点选家具：info={name,size,mat,desc,room} */
function regInfo(obj, name, size, mat, desc, roomId){

function group(x,y,z,parent){
  var g=new THREE.Group(); g.position.set(x||0,y||0,z||0); (parent||scene).add(g); return g;

/* 带开口的墙：openings=[{s0,s1,y0,y1,glass}]，s 沿墙长方向（米），y0=洞底高，y1=洞顶高 */
function buildWall(x1,z1,x2,z2,opt){
  opt = opt||{};
  var h = opt.h||2.8, t = opt.t||0.24, mat = opt.mat||M.wall;
  var dx=x2-x1, dz=z2-z1, L=Math.sqrt(dx*dx+dz*dz);
  var g = new THREE.Group();
  g.position.set(x1,0,z1); g.rotation.y = -Math.atan2(dz,dx);
  scene.add(g);
  var ops = (opt.openings||[]).slice().sort(function(a,b){return a.s0-b.s0;});
  function seg(s0,s1,y0,y1){
    if(s1-s0<0.01||y1-y0<0.01) return;
    box(s1-s0, y1-y0, t, mat, (s0+s1)/2, (y0+y1)/2, 0, g);
  }
  var cur=0;
  ops.forEach(function(o){
    seg(cur, o.s0, 0, h);                 /* 洞左侧整墙 */
    seg(o.s0, o.s1, 0, o.y0||0);          /* 窗台下 */
    seg(o.s0, o.s1, o.y1, h);             /* 洞口上方过梁 */
    if(o.glass){
      var gl = box(o.s1-o.s0-0.06, o.y1-(o.y0||0)-0.06, 0.03, M.glass, (o.s0+o.s1)/2, ((o.y0||0)+o.y1)/2, 0, g, false);
      gl.castShadow=false;
      /* 窗框 */
      box(o.s1-o.s0, 0.05, t*0.7, M.black, (o.s0+o.s1)/2, o.y1-0.025, 0, g, false);
      box(o.s1-o.s0, 0.05, t*0.7, M.black, (o.s0+o.s1)/2, (o.y0||0)+0.025, 0, g, false);
      box(0.05, o.y1-(o.y0||0), t*0.7, M.black, o.s0+0.025, ((o.y0||0)+o.y1)/2, 0, g, false);
      box(0.05, o.y1-(o.y0||0), t*0.7, M.black, o.s1-0.025, ((o.y0||0)+o.y1)/2, 0, g, false);
    }
    cur=o.s1;
  });
  seg(cur, L, 0, h);
  return g;
}

function updateLabels(){
  if(state.mode!=='plan') return;
  var v=new THREE.Vector3();
  labelEls.forEach(function(L){
    v.set(L.x,0,L.z).project(planCam);
    L.el.style.left=((v.x*0.5+0.5)*window.innerWidth)+'px';
    L.el.style.top=((-v.y*0.5+0.5)*window.innerHeight)+'px';
  });
}

/* 相机飞行（缓动） */
var fly = null;
function flyTo(pos, tgt, dur, done){
  var cam = perspCam;
  fly = { t:0, dur:dur||1.4, done:done,
    p0:cam.position.clone(), p1:new THREE.Vector3(pos[0],pos[1],pos[2]),
    t0:orbit.target.clone(), t1:new THREE.Vector3(tgt[0],tgt[1],tgt[2]) };
}
function stepFly(dt){
  if(!fly) return;
  fly.t += dt/fly.dur;
  var k = fly.t>=1 ? 1 : (1-Math.pow(1-fly.t,3));
  perspCam.position.lerpVectors(fly.p0, fly.p1, k);
  orbit.target.lerpVectors(fly.t0, fly.t1, k);
  if(fly.t>=1){ var d=fly.done; fly=null; if(d) d(); }
}

var roomPanel = document.getElementById('roomPanel');
ROOMS.forEach(function(r){
  var b=document.createElement('button'); b.className='room-btn'; b.dataset.room=r.id;
  b.innerHTML='<span class="ric">'+(ROOM_ICONS[r.id]||'')+'</span><span class="rname">'+r.name+'</span><small>'+roomDims(r)+'</small>';
  b.addEventListener('click', function(){ selectRoom(r.id, true); });
  roomPanel.appendChild(b);

function selectRoom(id, doFly){
  var r = roomById(id); if(!r) return;
  state.room = id;
  document.querySelectorAll('.room-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.room===id); });
  /* 高亮地面光框 */
  roomHighlight.visible = true;
  roomHighlight.scale.set(r.rect[2]-r.rect[0], r.rect[3]-r.rect[1], 1);
  roomHighlight.position.set((r.rect[0]+r.rect[2])/2, 0.015, (r.rect[1]+r.rect[3])/2);
  if(state.mode==='plan'){
    var c=roomCenter(r);
    planCtrl.target.set(c[0],0,c[1]);
    return;
  }
  if(state.mode==='fp'){ enterFP(c[0], c[1]); return; }
  if(doFly) flyTo(r.view.cam, r.view.tgt, 1.5);
}

/* 家具点选（射线拾取，区分拖拽与点击） */
var raycaster = new THREE.Raycaster();
var pointerDown = null;
canvas.addEventListener('pointerdown', function(e){
  pointerDown = { x:e.clientX, y:e.clientY };
  if(state.tour) stopTour();
  fly = null;
});
canvas.addEventListener('pointerup', function(e){
  if(!pointerDown) return;
  var moved = Math.hypot(e.clientX-pointerDown.x, e.clientY-pointerDown.y);
  pointerDown = null;
  if(moved>6 || state.mode==='plan' || arrange.on) return;
  pickAt(e.clientX, e.clientY);
});
function pickAt(cx, cy){
  var ndc = new THREE.Vector2((cx/window.innerWidth)*2-1, -(cy/window.innerHeight)*2+1);
  raycaster.setFromCamera(ndc, perspCam);
  var hits = raycaster.intersectObjects(pickables, true);
  for(var i=0;i<hits.length;i++){
    var o = hits[i].object;
    while(o && !o.userData.info) o = o.parent;
    if(o){ showInfo(o); return; }
  }
  hideInfo();
}
var infoCard=document.getElementById('infoCard');
function showInfo(obj){
  var info=obj.userData.info;
  document.getElementById('infoRoom').textContent = (roomById(info.room)||{}).name || '';
  document.getElementById('infoName').textContent = info.name;
  document.getElementById('infoSize').textContent = info.size;
  document.getElementById('infoMat').textContent = info.mat;
  document.getElementById('infoDesc').textContent = info.desc;
  infoCard.classList.add('open');
  if(selHelper) scene.remove(selHelper);
  selHelper = new THREE.BoxHelper(obj, 0xa5763f);
  scene.add(selHelper);
  poke();
}
function hideInfo(){
  infoCard.classList.remove('open');
  if(selHelper){ scene.remove(selHelper); selHelper=null; }
  poke();
}
document.getElementById('infoClose').addEventListener('click', hideInfo);

/* 材质主题换肤（0.6s 过渡）；UI accent 色同步跟随 */
var THEME_ACCENTS = {
  wood: ['#bc6c3f','#9e5527','rgba(188,108,63,.13)'],
  grey: ['#71879c','#55677a','rgba(113,135,156,.14)'],
  cream:['#bd8f4e','#9c6f36','rgba(189,143,78,.14)']
};
var themeAnim = null;
function setTheme(name){
  state.theme = name;
  var acc = THEME_ACCENTS[name];
  if(acc){
    document.documentElement.style.setProperty('--accent', acc[0]);
    document.documentElement.style.setProperty('--accent-deep', acc[1]);
    document.documentElement.style.setProperty('--accent-soft', acc[2]);
  }
  var tp = document.getElementById('themePop'); if(tp) tp.classList.remove('open');
  document.querySelectorAll('[data-theme]').forEach(function(b){ b.classList.toggle('active', b.dataset.theme===name); });
  var from={}, to={};
  Object.keys(themedMats).forEach(function(k){
    if(k==='curtainMeshes') return;
    from[k]=themedMats[k].color.clone(); to[k]=new THREE.Color(THEMES[name][k]);
  });
  var cFrom=(themedMats.curtainMeshes||[]).map(function(m){return m.color.clone();});
  var cTo=new THREE.Color(THEMES[name].curtain);
  themeAnim = { t:0, from:from, to:to, cFrom:cFrom, cTo:cTo };
  poke(800);
}
document.querySelectorAll('[data-theme]').forEach(function(b){
  b.addEventListener('click', function(){ setTheme(b.dataset.theme); });
});
function stepTheme(dt){
  if(!themeAnim) return;
  themeAnim.t += dt/0.6;
  var k = themeAnim.t>=1 ? 1 : (1-Math.pow(1-themeAnim.t,2));
  Object.keys(themeAnim.to).forEach(function(key){
    themedMats[key].color.lerpColors(themeAnim.from[key], themeAnim.to[key], k);
  });
  (themedMats.curtainMeshes||[]).forEach(function(m,i){
    m.color.lerpColors(themeAnim.cFrom[i], themeAnim.cTo, k);
  });
  if(themeAnim.t>=1) themeAnim=null;
}

/* 日夜灯光（参数阻尼趋近，天然平滑过渡） */
var lightCur = { sun:1.15, hemi:0.55, pts:0, down:0.12, shade:0.05, strip:0.1, bg:new THREE.Color(0xa9c8de), back:new THREE.Color(0xcfe4f2), ground:new THREE.Color(0x9aa48c), bld:new THREE.Color(0xaebfca), sunCol:new THREE.Color(0xffe2b0) };
var LIGHT_TARGETS = {
  day:   { sun:1.15, hemi:0.55, pts:0,   down:0.12, shade:0.05, strip:0.1, bg:0xa9c8de, back:0xcfe4f2, ground:0x9aa48c, bld:0xaebfca, sunCol:0xffe2b0 },
  night: { sun:0.10, hemi:0.12, pts:0.95, down:1.6, shade:1.15, strip:1.4, bg:0x0d1826, back:0x14273e, ground:0x27313c, bld:0x1a2635, sunCol:0x8fb4ff }
};
var lightTgt = LIGHT_TARGETS.day;
function setLight(night){
  state.night = night;
  var lt = document.getElementById('lightToggle'); if(lt) lt.classList.toggle('is-night', night);
  lightTgt = night ? LIGHT_TARGETS.night : LIGHT_TARGETS.day;
  poke(1800); /* 灯光参数约 1.5s 内趋近目标 */
  document.querySelectorAll('[data-light]').forEach(function(b){
    b.classList.toggle('active', (b.dataset.light==='night')===night);
  });
}
document.querySelectorAll('[data-light]').forEach(function(b){
  b.addEventListener('click', function(){ setLight(b.dataset.light==='night'); });
});
function stepLight(dt){
  var f = Math.min(1, dt*3.2);
  lightCur.sun += (lightTgt.sun-lightCur.sun)*f;
  lightCur.hemi += (lightTgt.hemi-lightCur.hemi)*f;
  lightCur.pts += (lightTgt.pts-lightCur.pts)*f;
  lightCur.down += (lightTgt.down-lightCur.down)*f;
  lightCur.shade += (lightTgt.shade-lightCur.shade)*f;
  lightCur.strip += (lightTgt.strip-lightCur.strip)*f;
  lightCur.bg.lerp(new THREE.Color(lightTgt.bg), f);
  lightCur.back.lerp(new THREE.Color(lightTgt.back), f);
  lightCur.ground.lerp(new THREE.Color(lightTgt.ground), f);
  lightCur.bld.lerp(new THREE.Color(lightTgt.bld), f);
  lightCur.sunCol.lerp(new THREE.Color(lightTgt.sunCol), f);
  sunLight.intensity=lightCur.sun; sunLight.color.copy(lightCur.sunCol);
  hemiLight.intensity=lightCur.hemi;
  pointLights.forEach(function(p){ p.intensity=lightCur.pts; });
  downMat.emissiveIntensity=lightCur.down;
  shadeMat.emissiveIntensity=lightCur.shade;
  stripMat.emissiveIntensity=lightCur.strip;
  scene.background.copy(lightCur.bg);
  backdropMat.color.copy(lightCur.back);
  groundMat.color.copy(lightCur.ground);
  buildingMats.forEach(function(m){ m.color.copy(lightCur.bld); });
}

/* 第一人称：WASD + 拖拽环视，位置限定户型内 */
var fp = { yaw:2.6, pitch:-0.05, keys:{}, dragging:false, lx:0, ly:0 };
function enterFP(cx, cz){
  perspCam.position.set(cx, 1.6, cz);
  fp.yaw = Math.atan2(-(0-cx), -(0.8-cz)); /* 朝向户型中心 */
  fp.pitch = -0.03;
}
canvas.addEventListener('pointerdown', function(e){
  if(state.mode!=='fp') return;
  fp.dragging=true; fp.lx=e.clientX; fp.ly=e.clientY;
});
window.addEventListener('pointermove', function(e){
  if(state.mode!=='fp' || !fp.dragging) return;
  fp.yaw -= (e.clientX-fp.lx)*0.0032;
  fp.pitch -= (e.clientY-fp.ly)*0.0032;
  fp.pitch = Math.max(-1.2, Math.min(1.2, fp.pitch));
  fp.lx=e.clientX; fp.ly=e.clientY;
});
window.addEventListener('pointerup', function(){ fp.dragging=false; });
window.addEventListener('keydown', function(e){
  fp.keys[e.code]=true;
  if(e.code==='Escape' && state.mode==='fp') setMode('3d');
  if(state.mode==='fp' && ['ArrowUp','ArrowDown','Space'].indexOf(e.code)>=0) e.preventDefault();
});
window.addEventListener('keyup', function(e){ fp.keys[e.code]=false; });
document.querySelectorAll('.fp-key').forEach(function(b){
  var code=b.dataset.k;
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); fp.keys[code]=true; });
  b.addEventListener('pointerup', function(){ fp.keys[code]=false; });
  b.addEventListener('pointerleave', function(){ fp.keys[code]=false; });
});
function stepFP(dt){
  if(state.mode!=='fp') return;
  var dir = new THREE.Vector3(-Math.sin(fp.yaw)*Math.cos(fp.pitch), Math.sin(fp.pitch), -Math.cos(fp.yaw)*Math.cos(fp.pitch));
  perspCam.lookAt(perspCam.position.clone().add(dir));
  var sp = 2.4*dt, f=0, r=0;
  if(fp.keys['KeyW']||fp.keys['ArrowUp']) f+=1;
  if(fp.keys['KeyS']||fp.keys['ArrowDown']) f-=1;
  if(fp.keys['KeyD']||fp.keys['ArrowRight']) r+=1;
  if(fp.keys['KeyA']||fp.keys['ArrowLeft']) r-=1;
  if(!f && !r) return;
  var fwd = new THREE.Vector3(-Math.sin(fp.yaw),0,-Math.cos(fp.yaw));
  var right = new THREE.Vector3(Math.cos(fp.yaw),0,-Math.sin(fp.yaw));
  perspCam.position.addScaledVector(fwd, f*sp).addScaledVector(right, r*sp);
  var p=perspCam.position;
  p.x = Math.max(-5.15, Math.min(5.15, p.x));
  if(p.z>3.85 && (p.x<-5.15 || p.x>-2.65)) p.z=3.85;         /* 阳台以外不得越出南墙 */
  p.z = Math.max(-3.85, Math.min(5.35, p.z));
  p.y = 1.6;
}

/* 自动导览：玄关→客厅→餐厅→厨房→主卧→次卧→卫生间→阳台，每站 4 秒 */
var SVG_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';
var SVG_STOP = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';
var tourCard=document.getElementById('tourCard');
var tourTimer=null, tourIdx=-1, tourStart=0;
var TOUR_ORDER=['entry','living','dining','kitchen','master','second','bath','balcony'];
function startTour(){
  if(state.mode!=='3d') setMode('3d');
  state.tour=true; tourIdx=-1;
  var tb=document.getElementById('tourBtn');
  tb.querySelector('.fab-label').textContent='导览中…';
  tb.querySelector('.fab-ic').innerHTML=SVG_STOP;
  tb.classList.add('playing');
  tourCard.classList.add('show');
  nextTourStep();
}
function nextTourStep(){
  tourIdx++;
  if(tourIdx>=TOUR_ORDER.length){ stopTour(); return; }
  var r=roomById(TOUR_ORDER[tourIdx]);
  selectRoom(r.id, false);
  flyTo(r.view.cam, r.view.tgt, 1.6);
  document.getElementById('tourTitle').textContent=r.name;
  document.getElementById('tourText').textContent=r.blurb;
  document.getElementById('tourStep').textContent=(tourIdx+1)+' / '+TOUR_ORDER.length;
  tourStart=performance.now();
  tourTimer=setTimeout(nextTourStep, 4000);
}
function stopTour(){
  if(tourTimer) clearTimeout(tourTimer);
  tourTimer=null; state.tour=false;
  var tb=document.getElementById('tourBtn');
  tb.querySelector('.fab-label').textContent='自动导览';
  tb.querySelector('.fab-ic').innerHTML=SVG_PLAY;
  tb.classList.remove('playing');
  tourCard.classList.remove('show');
}
document.getElementById('tourBtn').addEventListener('click', function(){ state.tour ? stopTour() : startTour(); });
document.getElementById('tourStop').addEventListener('click', stopTour);

/* ================= 布置模式：拖动 / 旋转 / 重置家具 =================
   初始摆位在 init() 建模完成后由 snapshotLayout() 快照进 INIT_LAYOUT，
   家具位置数据集中在此：拖动只改根节点的 position.x/z 与 rotation.y。 */
var INIT_LAYOUT = [];
function snapshotLayout(){
  INIT_LAYOUT = pickables.map(function(o){
    o.userData.baseY = o.position.y;
    o.userData.rotTgt = o.rotation.y;
    return { o:o, x:o.position.x, z:o.position.z, r:o.rotation.y };
  });
}
var arrange = { on:false, sel:null, dragging:false, snap:false, lift:0, liftObj:null, selTop:1,
  target:new THREE.Vector3(), offset:new THREE.Vector3(), pointers:{}, tweens:[] };
var dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);   /* 地面拖动平面 y=0 */
var selChip = document.getElementById('selChip');
var selName = document.getElementById('selName');

/* 选中柔光圈：径向渐变贴图圆盘，贴地跟随家具 */
var glowTex = makeCanvas(256,256,function(g){
  var gr = g.createRadialGradient(128,128,8,128,128,128);
  gr.addColorStop(0,'rgba(255,196,130,0.9)');
  gr.addColorStop(0.55,'rgba(232,164,94,0.38)');
  gr.addColorStop(1,'rgba(232,164,94,0)');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
});
var glowDisc = new THREE.Mesh(new THREE.CircleGeometry(1,40),
  new THREE.MeshBasicMaterial({ map:glowTex, transparent:true, depthWrite:false, opacity:0.85 }));
glowDisc.rotation.x = -Math.PI/2; glowDisc.position.y = 0.02;
glowDisc.visible = false; glowDisc.renderOrder = 5;
scene.add(glowDisc);

function setArrange(on){
  arrange.on = on;
  document.body.classList.toggle('arrange-mode', on);
  var ab = document.getElementById('arrangeBtn');
  ab.classList.toggle('on', on);
  ab.setAttribute('aria-pressed', on ? 'true' : 'false');
  canvas.style.cursor = on ? 'grab' : '';
  if(on){
    if(state.mode !== '3d') setMode('3d');
    hideInfo();
  } else {
    selectFurniture(null);
    arrange.dragging = false;
    orbit.enabled = (state.mode === '3d');
  }
  poke(300);
}
function selectFurniture(obj){
  if(arrange.sel && arrange.sel !== obj) arrange.liftObj = arrange.sel;   /* 上一件家具缓缓落回 */
  arrange.sel = obj;
  arrange.lift = 0;
  if(obj){
    if(arrange.liftObj === obj) arrange.liftObj = null;
    var bb = new THREE.Box3().setFromObject(obj);
    var sz = bb.getSize(new THREE.Vector3());
    var rad = Math.max(0.5, Math.max(sz.x, sz.z)*0.62 + 0.2);
    glowDisc.scale.set(rad, rad, 1);
    arrange.selTop = bb.max.y + 0.12;
    arrange.target.copy(obj.position);
    selName.textContent = (obj.userData.info || {}).name || '家具';
    glowDisc.visible = true;
    positionGlow();
  } else {
    glowDisc.visible = false;
    selChip.style.display = 'none';
  }
  poke(400);
}
function positionGlow(){
  if(!arrange.sel) return;
  glowDisc.position.x = arrange.sel.position.x;
  glowDisc.position.z = arrange.sel.position.z;
}
var _sv = new THREE.Vector3();
function updateSelChip(){
  if(!arrange.sel) return;
  arrange.sel.getWorldPosition(_sv);
  _sv.y = arrange.selTop;
  _sv.project(perspCam);
  if(_sv.z > 1){ selChip.style.display = 'none'; return; }
  selChip.style.display = 'flex';
  selChip.style.left = ((_sv.x*0.5+0.5)*window.innerWidth) + 'px';
  selChip.style.top = ((-_sv.y*0.5+0.5)*window.innerHeight - 12) + 'px';
}
function pickFurnitureAt(cx, cy){
  var ndc = new THREE.Vector2((cx/window.innerWidth)*2-1, -(cy/window.innerHeight)*2+1);
  raycaster.setFromCamera(ndc, perspCam);
  var hits = raycaster.intersectObjects(pickables, true);
  for(var i=0;i<hits.length;i++){
    var o = hits[i].object;
    while(o && !o.userData.info) o = o.parent;
    if(o){
      var pt = new THREE.Vector3();
      if(!raycaster.ray.intersectPlane(dragPlane, pt)) pt.copy(o.position);
      return { obj:o, point:pt };
    }
  }
  return null;
}
/* 家具活动范围：主户型矩形 + 阳台矩形，越界松手后由插值弹回 */
function clampToFloor(x, z){
  if(z > 3.85 && x <= -2.55) return [Math.max(-5.15, Math.min(-2.55, x)), Math.max(3.85, Math.min(5.35, z))];
  return [Math.max(-5.15, Math.min(5.15, x)), Math.max(-3.85, Math.min(3.85, z))];
}
canvas.addEventListener('pointerdown', function(e){
  if(!arrange.on || state.mode !== '3d') return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  arrange.pointers[e.pointerId] = true;
  if(Object.keys(arrange.pointers).length > 1){   /* 第二指落下：取消拖动，多指手势交还视角旋转/缩放 */
    arrange.dragging = false;
    orbit.enabled = true;
    canvas.style.cursor = 'grab';
    return;
  }
  var hit = pickFurnitureAt(e.clientX, e.clientY);
  if(hit){
    selectFurniture(hit.obj);
    arrange.dragging = true;
    arrange.offset.copy(hit.point).sub(hit.obj.position); arrange.offset.y = 0;
    arrange.target.copy(hit.obj.position);
    orbit.enabled = false;               /* 拖动期间禁用 OrbitControls，避免与相机旋转冲突 */
    canvas.style.cursor = 'grabbing';
    poke();
  } else {
    selectFurniture(null);
  }
});
window.addEventListener('pointermove', function(e){
  if(!arrange.on || !arrange.dragging || !arrange.sel || !arrange.pointers[e.pointerId]) return;
  var ndc = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
  raycaster.setFromCamera(ndc, perspCam);
  var pt = new THREE.Vector3();
  if(raycaster.ray.intersectPlane(dragPlane, pt)){
    arrange.target.set(pt.x - arrange.offset.x, arrange.sel.position.y, pt.z - arrange.offset.z);
    if(arrange.snap){   /* 网格吸附 0.1m */
      arrange.target.x = Math.round(arrange.target.x*10)/10;
      arrange.target.z = Math.round(arrange.target.z*10)/10;
    }
    poke();
  }
});
function endArrangePointer(e){
  if(e.pointerId != null) delete arrange.pointers[e.pointerId];
  if(!arrange.dragging) return;
  arrange.dragging = false;
  if(arrange.sel){   /* 松手钳回合法区域，平滑插值形成弹性回弹 */
    var c = clampToFloor(arrange.target.x, arrange.target.z);
    arrange.target.x = c[0]; arrange.target.z = c[1];
  }
  orbit.enabled = (state.mode === '3d');
  canvas.style.cursor = arrange.on ? 'grab' : '';
  poke(300);
}
window.addEventListener('pointerup', endArrangePointer);
window.addEventListener('pointercancel', endArrangePointer);

/* 旋转 / 重置补间（与渲染循环解耦，仅推进数值） */
function tweenObj(o, toPos, toRot, dur){
  arrange.tweens = arrange.tweens.filter(function(t){ return t.o !== o; });
  arrange.tweens.push({ o:o, t:0, dur:dur || 0.45,
    x0:o.position.x, z0:o.position.z, r0:o.rotation.y,
    x1:toPos ? toPos.x : o.position.x, z1:toPos ? toPos.z : o.position.z,
    r1:(toRot != null ? toRot : o.rotation.y) });
  if(toRot != null) o.userData.rotTgt = toRot;
  poke((dur || 0.45)*1000 + 120);
}
function rotateSelected(){
  if(!arrange.sel) return;
  var o = arrange.sel;
  var base = (o.userData.rotTgt != null ? o.userData.rotTgt : o.rotation.y);
  tweenObj(o, null, base + Math.PI/4, 0.42);   /* 45° 步进 */
}
function resetLayout(){
  INIT_LAYOUT.forEach(function(it){ tweenObj(it.o, { x:it.x, z:it.z }, it.r, 0.65); });
}
function stepArrange(dt){
  for(var i=arrange.tweens.length-1; i>=0; i--){
    var tw = arrange.tweens[i];
    tw.t += dt/tw.dur;
    var e = 1 - Math.pow(1 - Math.min(1, tw.t), 3);
    tw.o.position.x = tw.x0 + (tw.x1-tw.x0)*e;
    tw.o.position.z = tw.z0 + (tw.z1-tw.z0)*e;
    tw.o.rotation.y = tw.r0 + (tw.r1-tw.r0)*e;
    if(tw.t >= 1) arrange.tweens.splice(i,1);
  }
  if(arrange.liftObj){
    var lo = arrange.liftObj, by = lo.userData.baseY || 0;
    lo.position.y += (by - lo.position.y)*Math.min(1, dt*10);
    if(Math.abs(lo.position.y - by) < 0.002){ lo.position.y = by; arrange.liftObj = null; }
  }
  var o = arrange.sel;
  if(!o) return;
  var hasTw = false;
  for(var j=0;j<arrange.tweens.length;j++) if(arrange.tweens[j].o === o) hasTw = true;
  if(hasTw) arrange.target.set(o.position.x, o.position.y, o.position.z);
  var k = 1 - Math.exp(-dt*12);   /* 拖动平滑插值（帧率无关指数趋近） */
  o.position.x += (arrange.target.x - o.position.x)*k;
  o.position.z += (arrange.target.z - o.position.z)*k;
  arrange.lift += (0.05 - arrange.lift)*Math.min(1, dt*8);   /* 选中轻微上浮 */
  o.position.y = (o.userData.baseY || 0) + arrange.lift + Math.sin(performance.now()*0.003)*0.008;
  positionGlow();
  glowDisc.material.opacity = 0.72 + 0.22*Math.sin(performance.now()*0.004);
  updateSelChip();
}

/* 布置模式控件接线 */
document.getElementById('arrangeBtn').addEventListener('click', function(){ setArrange(!arrange.on); });
document.getElementById('exitArrangeBtn').addEventListener('click', function(){ setArrange(false); });
document.getElementById('rotateBtn').addEventListener('click', rotateSelected);
document.getElementById('chipRotate').addEventListener('click', rotateSelected);
document.getElementById('chipDone').addEventListener('click', function(){ setArrange(false); });
document.getElementById('resetLayoutBtn').addEventListener('click', resetLayout);
var snapBtn = document.getElementById('snapBtn');
snapBtn.addEventListener('click', function(){
  arrange.snap = !arrange.snap;
  snapBtn.classList.toggle('on', arrange.snap);
});
window.addEventListener('keydown', function(e){
  if(!arrange.on) return;
  if(e.code === 'KeyR') rotateSelected();
  if(e.code === 'Escape') setArrange(false);
});

/* 右下角浮动组：主题弹层 / 日夜切换 */
var themeFab = document.getElementById('themeFab');
var themePop = document.getElementById('themePop');
themeFab.addEventListener('click', function(e){ e.stopPropagation(); themePop.classList.toggle('open'); });
document.addEventListener('click', function(e){ if(!themePop.contains(e.target)) themePop.classList.remove('open'); });
document.getElementById('lightToggle').addEventListener('click', function(){ setLight(!state.night); });

/* 顶栏分段控件滑动指示条 */
function updateSegInd(){
  var act = document.querySelector('.view-seg .seg-btn.active');
  var ind = document.querySelector('.seg-ind');
  if(!act || !ind) return;
  ind.style.width = act.offsetWidth + 'px';
  ind.style.transform = 'translateX(' + act.offsetLeft + 'px)';
}
window.addEventListener('load', updateSegInd);

/* ---------- 渲染循环 ---------- */
var clock = new THREE.Clock();
var shadowBaked = false;
var camMode = function(){ return state.mode==='plan' ? planCam : perspCam; };
function animate(){
  requestAnimationFrame(animate);
  var dt = Math.min(0.05, clock.getDelta());
  stepFly(dt); stepTheme(dt); stepLight(dt); stepFP(dt); stepArrange(dt);
  if(orbit.enabled) orbit.update();
  if(planCtrl.enabled) planCtrl.update();
  /* 娃娃机视角：相机高于屋顶时隐藏天花与筒灯，室内一览无余 */
  var ceilShow = state.mode!=='plan' && (state.mode==='fp' || perspCam.position.y < 2.92);
  if(ceilingGroup.visible !== ceilShow){ ceilingGroup.visible = ceilShow; downLightsGroup.visible = ceilShow; poke(); }
  if(state.tour && tourTimer){
    var p = Math.min(1,(performance.now()-tourStart)/4000);
    document.getElementById('tourBar').style.width=(p*100)+'%';
  }
  /* 按需渲染：飞行/过渡/第一人称/导览期间逐帧渲染，其余仅在画面脏时渲染 */
  var active = !!fly || !!themeAnim || performance.now()<animUntil || state.mode==='fp' || state.tour || arrange.on || arrange.tweens.length>0 || !!arrange.liftObj;
  if(dirty || active){
    if(!shadowBaked || arrange.on || arrange.tweens.length>0){ renderer.shadowMap.needsUpdate = true; }   /* 布置拖动/补间期间阴影实时跟随 */
    renderer.render(scene, camMode());
    shadowBaked = true;
    dirty = false;
  }
  updateLabels();
}

window.addEventListener('resize', function(){
  renderer.setSize(window.innerWidth, window.innerHeight);
  perspCam.aspect = window.innerWidth/window.innerHeight;
  perspCam.updateProjectionMatrix();
  fitPlanCam();
  updateSegInd();
  poke();
});

/* ---------- 启动：分步建场景并推进加载条 ---------- */
(async function init(){
  try{
    for(var i=0;i<BUILD_STEPS.length;i++){
      setProgress(i/BUILD_STEPS.length, BUILD_STEPS[i][0]);
      await nextFrame();
      BUILD_STEPS[i][1]();
    }
    snapshotLayout();
    setProgress(1, '加载完成');
    animate();
    await nextFrame();
    document.getElementById('loading').classList.add('done');
    /* 开场镜头：自西南高空缓缓推近（阳台与客厅一侧朝向观众） */
    flyTo([-8.6, 7.2, 10.8],[0,0.5,0.8], 2.2);
    selectRoom('living', false);
    setTheme('wood'); setLight(false);
    updateSegInd(); setTimeout(updateSegInd, 400);
  }catch(err){
    setProgress(1, '加载出错：'+err.message);
    if(window.console) console.error(err);
  }
})();
})();
</script>
